name: repro

# A long repro on demand, on the runner class a failure came from (plan 41 2.2.1): one spec's cases, by grep, repeated
# on the chosen projects at any ref, older refs that predate this file included. The dev servers trace each request's
# lifecycle where the ref has tests/e2e/trace.ts (BUGS.md 453), the test results are uploaded whether the run passes or
# fails, and the job summary counts each project's passed, failed, and flaky runs, so a dispatch reads without a
# download.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The commit, tag, or branch to run
        required: true
      spec:
        description: The spec file under packages/core/tests/e2e, as Playwright filters it (minimal.test.ts)
        required: true
      grep:
        description: The cases, as Playwright's -g reads it
        required: true
      projects:
        description: Space-separated Playwright projects (node-dev-webkit bun-dev-webkit)
        required: true
      repeat-each:
        description: Runs per case per project
        required: true
        default: "50"
      timeout:
        description: Each case's timeout in ms, for a hang that needs more room or a bound to tighten; empty keeps the config's
        required: false
        default: ""
      runner:
        description: The runner class
        required: true
        default: macos-latest
        type: choice
        options: [macos-latest, ubuntu-latest]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.3"

jobs:
  repro:
    name: repro ${{ inputs.ref }} ${{ inputs.grep }}
    runs-on: ${{ inputs.runner }}
    # A long repeat on a slow runner; the limit catches a hang.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - name: Repeat the cases
        env:
          FLARE_E2E_TRACE: "1"
          SPEC: ${{ inputs.spec }}
          GREP: ${{ inputs.grep }}
          PROJECTS: ${{ inputs.projects }}
          REPEAT: ${{ inputs.repeat-each }}
          TIMEOUT: ${{ inputs.timeout }}
          # The JSON reporter writes here, the line reporter to the log.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/repro.json
        run: |
          args=()
          # `--project=name`: a bare `--project` takes every value after it, the spec included.
          for project in $PROJECTS; do args+=("--project=$project"); done
          if [ -n "$TIMEOUT" ]; then args+=(--timeout "$TIMEOUT"); fi
          bunx playwright test -c packages/core/tests/e2e/playwright.config.ts "${args[@]}" "$SPEC" -g "$GREP" \
            --repeat-each "$REPEAT" --retries 0 --reporter=line,json
      # Each project's passed, failed, flaky, and skipped runs, and the failed and flaky ones by case, project, repeat,
      # and first error line, from Playwright's JSON report; a run that stopped before any case says so.
      - name: Summarize
        if: always()
        run: |
          node -e '
            const fs = require("node:fs")
            // The summary for a person, and the same text in a folded log group for a script: the API has no summary.
            const out = (lines) => {
              const text = ["### repro", "", ...lines, ""].join("\n")
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text)
              process.stdout.write(`::group::repro\n${text}::endgroup::\n`)
            }
            if (!fs.existsSync("repro.json")) {
              out(["no report: Playwright stopped before running a case; the log says why"])
              process.exit(0)
            }
            const report = JSON.parse(fs.readFileSync("repro.json", "utf8"))
            const plain = (text) => String(text).replace(/\u001b\[[0-9;]*m/g, "")
            const cell = (text) => plain(text).split("\n")[0].replaceAll("|", "\\|").slice(0, 160)
            const counts = {}
            const failed = []
            const seen = {}
            const walk = (suite, titles) => {
              for (const spec of suite.specs ?? [])
                for (const test of spec.tests) {
                  const key = [spec.file, spec.line, test.projectName].join(" ")
                  const repeat = (seen[key] = (seen[key] ?? -1) + 1)
                  const row = (counts[test.projectName] ??= { passed: 0, failed: 0, flaky: 0, skipped: 0 })
                  const status = test.status === "expected" ? "passed" : test.status === "unexpected" ? "failed" : test.status
                  row[status] = (row[status] ?? 0) + 1
                  if (status !== "failed" && status !== "flaky") continue
                  const error = test.results.flatMap((result) => result.errors ?? []).map((found) => found.message ?? "")[0] ?? ""
                  failed.push(`| ${cell([...titles, spec.title].join(" › "))} | ${test.projectName} | ${repeat} | ${status} | ${cell(error)} |`)
                }
              for (const child of suite.suites ?? []) walk(child, child.title === "" ? titles : [...titles, child.title])
            }
            for (const suite of report.suites) walk(suite, [suite.title])
            const lines = ["| project | passed | failed | flaky | skipped |", "| --- | --- | --- | --- | --- |"]
            for (const [name, row] of Object.entries(counts)) lines.push(`| ${name} | ${row.passed} | ${row.failed} | ${row.flaky} | ${row.skipped} |`)
            if (failed.length > 0) {
              lines.push("", "| case | project | repeat | status | first error line |", "| --- | --- | --- | --- | --- |")
              lines.push(...failed.slice(0, 20))
              if (failed.length > 20) lines.push(`and ${failed.length - 20} more in repro.json`)
            }
            out(lines)
          '
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-${{ github.run_id }}
          # The cases' own output (error-context, server and navigation logs, traces), and the JSON report with every
          # repeat's status and duration. A case whose hooks failed first writes no output of its own (BUGS.md 453).
          path: |
            packages/core/test-results
            repro.json
          retention-days: 14
