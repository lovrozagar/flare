name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.3"

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    # The job takes 7 to 10 minutes on a runner, `test` 4 to 6 and `test:bun` 2.5 to 4; the limit catches a hang, not a
    # slow runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The golden test's `dev from tarball` row hydrates the installed package in Chromium (bits/14).
      - run: bunx playwright install --with-deps chromium
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # The same suite under the Bun runtime, without the coverage gate: coverage is measured under Node (00-rules).
      - run: bun run test:bun
      # The finished tree: every phase complete, the last one included.
      - run: bun scripts/check-tree.ts --complete P14

  # The packed tarball installed as an app installs it, with Nodes scripts/node-at.ts pins and their own npm, the peers
  # at their floors (plan 21 5.5). The cells install from the registry, so they run here, not in `verify`. The newest
  # peers run daily (consumers-newest.yml) and before a release.
  consumers:
    name: consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run --filter @lovrozagar/flare test:consumers

  # The grid runs inside the pinned browser image, the one a local run's container uses (B70, B97), and launches its
  # engines directly. `--user 1001` is the runner's user, under which Firefox starts; `--ipc=host` gives Chromium the
  # host's shared memory.
  e2e-linux:
    name: e2e-linux (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # A shard takes 8 to 15 minutes on a runner; the limit catches a hang, not a slow runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # The image has no unzip, which setup-bun needs, and the job's user cannot install it. npm's `bun` package takes
      # the platform binary through an optional dependency, with no unzip.
      - name: Install Bun
        run: |
          npm install --global --prefix "$HOME/.bun-npm" "bun@$BUN_VERSION"
          echo "$HOME/.bun-npm/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      # The dev servers log each request's lifecycle into the server log a failed case carries (tests/e2e/trace.ts, BUGS.md 453).
      - run: bun run test:e2e -- --shard=${{ matrix.shard }}/3
        env:
          FLARE_E2E_TRACE: "1"
      # The test results: each failing case's error context (its page snapshot), server log (crash.ts, docs.fixture.ts), and navigation log (crash.ts); tracing is off (B34), so a CI-only failure can be read (BUGS.md 93, 34.6).
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-linux-${{ matrix.shard }}
          path: packages/core/test-results
          retention-days: 7

  # The Safari-engine check: the 6 webkit projects on macOS (B97), every deep spec on each, in 3 shards so each stays
  # inside its timeout. The unit suite's macOS run (B3, BUGS.md B27, B51) goes in the first shard only.
  e2e-mac:
    name: e2e-mac (${{ matrix.shard }}/3)
    runs-on: macos-latest
    # Shards 2 and 3 take 8 to 13 minutes; shard 1, with the unit suite, 19 to 21, and its 20-minute limit cancelled it
    # (CI 39096308581). The limit catches a hang, not a slow runner.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The unit suite's golden `dev from tarball` row hydrates in Chromium (bits/14), and the hydrate harness, with no
      # Docker here, runs every engine from these local installs (bits/15).
      - run: bunx playwright install --with-deps chromium firefox webkit
      - if: matrix.shard == 1
        run: bun run test
      - run: >-
          bun run test:e2e --
          --project node-dev-webkit --project node-prod-webkit --project bun-dev-webkit
          --project bun-prod-webkit --project workers-dev-webkit --project workers-prod-webkit
          --shard=${{ matrix.shard }}/3
        env:
          FLARE_E2E_TRACE: "1"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-mac-${{ matrix.shard }}
          path: packages/core/test-results
          retention-days: 7
