name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.3"

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The golden test's `dev from tarball` row hydrates the installed package in Chromium (bits/14).
      - run: bunx playwright install --with-deps chromium
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # The same suite under the Bun runtime, without the coverage gate: coverage is measured under Node (00-rules).
      - run: bun run test:bun
      # The finished tree: every phase complete, the last one included.
      - run: bun scripts/check-tree.ts --complete P14

  # The grid runs inside the pinned browser image, the one a local run's container uses (B70, B97), and launches its
  # engines directly. `--user 1001` is the runner's user, under which Firefox starts; `--ipc=host` gives Chromium the
  # host's shared memory.
  e2e-linux:
    name: e2e-linux (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The image has no unzip, which setup-bun needs, and the job's user cannot install it. npm's `bun` package takes
      # the platform binary through an optional dependency, with no unzip.
      - name: Install Bun
        run: |
          npm install --global --prefix "$HOME/.bun-npm" "bun@$BUN_VERSION"
          echo "$HOME/.bun-npm/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e -- --shard=${{ matrix.shard }}/3
      # The test results: each failing case's error context (its page snapshot), server logs (docs.fixture.ts), and navigation log (crash.ts); tracing is off (B34), so a CI-only failure can be read (BUGS.md 93, 34.6).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-linux-${{ matrix.shard }}
          path: packages/core/test-results
          retention-days: 7

  # The Safari-engine check: the 6 webkit projects on macOS (B97), every deep spec on each, in 3 shards so each stays
  # inside its timeout. The unit suite's macOS run (B3, BUGS.md B27, B51) goes in the first shard only.
  e2e-mac:
    name: e2e-mac (${{ matrix.shard }}/3)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The unit suite's golden `dev from tarball` row hydrates in Chromium (bits/14), and the hydrate harness, with no
      # Docker here, runs every engine from these local installs (bits/15).
      - run: bunx playwright install --with-deps chromium firefox webkit
      - if: matrix.shard == 1
        run: bun run test
      - run: >-
          bun run test:e2e --
          --project node-dev-webkit --project node-prod-webkit --project bun-dev-webkit
          --project bun-prod-webkit --project workers-dev-webkit --project workers-prod-webkit
          --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mac-${{ matrix.shard }}
          path: packages/core/test-results
          retention-days: 7
