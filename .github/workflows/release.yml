name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run test
      - run: bun run test:cli

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/core/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v${tag} does not match packages/core version ${pkg}"
            exit 1
          fi

      - name: Sync package README and license
        run: |
          cp README.md packages/core/README.md
          cp LICENSE packages/core/LICENSE

      - name: Publish @lovrozagar/flare
        working-directory: packages/core
        run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
