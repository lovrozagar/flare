name: Release

# A pushed `v*` tag verifies, then publishes the one verified tarball of @lovrozagar/flare (bits/14). A dispatch only
# verifies: `scripts/release.ts --publish` refuses anywhere but a tag ref, so a publish is re-run from that tag's run.
# Every action is pinned to a commit SHA, and the publish job installs nothing unpinned: Node 24's own npm publishes
# with provenance (plan 21 14.4, BUGS.md 219).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

env:
  BUN_VERSION: "1.4.3"
  PACKAGE_NAME: "@lovrozagar/flare"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox
      # The gates, the finished tree, the e2e, the packed tarball, the golden proof on it, and `npm publish --dry-run`.
      - run: bun scripts/release.ts --out "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball
          path: ${{ runner.temp }}/release/lovrozagar-flare-*.tgz
          if-no-files-found: error

  npmjs:
    name: npmjs.com
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarball
          path: ${{ runner.temp }}/release
      - name: Publish the verified tarball to registry.npmjs.org
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          name="${{ env.PACKAGE_NAME }}"
          tarball="$RUNNER_TEMP/release/lovrozagar-flare-${tag}.tgz"
          encoded="$(node -p 'encodeURIComponent(process.argv[1])' "$name")"

          if npm view "${name}@${tag}" version >/dev/null 2>&1; then
            echo "npm already has ${name}@${tag} — skipping"
            exit 0
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC request URL/token missing — id-token: write is not in effect"
            exit 1
          fi
          audience="$(node -p 'encodeURIComponent("npm:registry.npmjs.org")')"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            -o /tmp/oidc.json
          node -e 'const j=require("/tmp/oidc.json"); if(!j.value) process.exit(2)'
          oidc_jwt="$(node -e 'process.stdout.write(require("/tmp/oidc.json").value)')"
          code=$(curl -sS -o /tmp/npm-ex.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${oidc_jwt}" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encoded}")
          echo "oidc exchange HTTP $code"
          if [ "$code" != "201" ]; then
            echo "npm rejected the GitHub OIDC token."
            echo "On https://www.npmjs.com/package/${name} → Settings → Trusted Publisher"
            echo "the saved connection must be exactly:"
            echo "  GitHub Actions / lovrozagar / flare / release.yml / environment empty / allow npm publish"
            exit 1
          fi
          NODE_AUTH_TOKEN="$(node -e 'process.stdout.write(require("/tmp/npm-ex.json").token || "")')"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "exchange succeeded but returned no token"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
          set +e
          bun scripts/release.ts --publish --tarball "$tarball"
          pub=$?
          set -e
          if [ "$pub" -eq 0 ]; then
            exit 0
          fi
          if npm view "${name}@${tag}" version >/dev/null 2>&1; then
            echo "publish raced; ${name}@${tag} is now on npm — treating as success"
            exit 0
          fi
          exit "$pub"

  gh-pkg:
    name: GitHub Packages
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@lovrozagar"
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarball
          path: ${{ runner.temp }}/release
      - name: Publish the verified tarball to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          name="${{ env.PACKAGE_NAME }}"
          tarball="$RUNNER_TEMP/release/lovrozagar-flare-${tag}.tgz"
          if npm view "${name}@${tag}" --registry https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "GitHub Packages already has ${name}@${tag} — skipping"
            exit 0
          fi
          set +e
          npm publish "$tarball" --access public --registry https://npm.pkg.github.com
          pub=$?
          set -e
          if [ "$pub" -eq 0 ]; then
            exit 0
          fi
          if npm view "${name}@${tag}" --registry https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "publish raced; ${name}@${tag} is now on GitHub Packages — treating as success"
            exit 0
          fi
          exit "$pub"

  github-release:
    name: GitHub Release
    needs: [npmjs, gh-pkg]
    if: ${{ !cancelled() && needs.gh-pkg.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          else
            gh release create "$tag" --generate-notes --title "${tag#v}"
          fi
